services:
  db:
    image: postgres:16
    # Parallel queries use shared memory (/dev/shm); Docker's default 64 MB runs out under
    # concurrent load and the queries fail (Scale Lab E9, E14).
    shm_size: 512mb
    # A larger buffer cache: ~10-20% more directory throughput (Scale Lab E14). work_mem is
    # left at its default: raising it removed the sort spills but didn't make anything faster.
    command: postgres -c shared_buffers=1GB
    env_file:
      - backend/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
